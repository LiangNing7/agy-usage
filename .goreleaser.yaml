version: 2

project_name: agy-usage

before:
  hooks:
    - go vet ./...
    - go test ./...

builds:
  - id: agy-usage
    main: ./cmd/agy-usage
    binary: agy-usage
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/LiangNing7/agy-usage/internal/version.GitVersion={{.Version}}
      - -X github.com/LiangNing7/agy-usage/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/LiangNing7/agy-usage/internal/version.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
