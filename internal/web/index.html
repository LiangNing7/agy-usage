<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antigravity Token Dashboard</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131b33;
    --panel-hover: #182342;
    --border: #233056;
    --text: #e6edf7;
    --muted: #8b9bb8;
    --cyan: #38bdf8;
    --green: #34d399;
    --purple: #c084fc;
    --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", monospace;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 1320px; margin: 0 auto; }
  header {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 20px;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.4px; color: var(--cyan); }
  .subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 11px; font-size: 13px; outline: none;
  }
  select:focus, input:focus, button:hover { border-color: var(--cyan); }
  button { cursor: pointer; }
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
  }
  .card .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .card .val { font-size: 26px; font-weight: 700; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .grid2 {
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 18px;
  }
  @media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 12px 0; font-size: 15px; color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.06); }
  th:first-child, td:first-child { text-align: left; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .bar-track {
    width: 100%; height: 10px; background: rgba(255,255,255,0.06);
    border-radius: 5px; overflow: hidden; display: flex;
  }
  .bar-net { background: var(--green); height: 100%; }
  .bar-cache { background: var(--cyan); height: 100%; opacity: 0.78; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 700;
  }
  .badge.ide { background: rgba(56,189,248,0.16); color: var(--cyan); }
  .badge.cli { background: rgba(192,132,252,0.18); color: var(--purple); }
  .subtag { color: var(--amber); font-size: 11px; margin-left: 6px; }
  .warn {
    background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.35);
    color: var(--amber); padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">◆ Antigravity Token Dashboard</h1>
      <div class="subtitle" id="updated">Loading...</div>
    </div>
    <div class="controls">
      <select id="surface">
        <option value="all">IDE + CLI</option>
        <option value="ide">IDE Only</option>
        <option value="cli">CLI Only</option>
      </select>
      <select id="days">
        <option value="0" data-i18n="allTime">All Time</option>
        <option value="1" data-i18n="today">Today</option>
        <option value="7" data-i18n="d7">Last 7 Days</option>
        <option value="30" data-i18n="d30">Last 30 Days</option>
      </select>
      <select id="flat">
        <option value="0" data-i18n="rollup">Rollup Subagents</option>
        <option value="1" data-i18n="flat">Flat Sessions</option>
      </select>
      <input id="search" type="text" placeholder="Filter project or title..." />
      <button id="langBtn" onclick="toggleLang()">中文 / EN</button>
      <button onclick="loadData()" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div id="warnBox" style="display:none" class="warn"></div>
  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="card">
      <h2 id="hDaily">Daily Trend</h2>
      <div id="daily"></div>
    </div>
    <div class="card">
      <h2 id="hModels">Model Breakdown</h2>
      <div id="models"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2 id="hProjects">Workspaces / Projects</h2>
      <div id="projects"></div>
    </div>
    <div class="card">
      <h2 id="hSurfaces">Surface Breakdown (IDE vs CLI)</h2>
      <div id="surfaces"></div>
    </div>
  </div>

  <div class="card">
    <h2 id="hSessions">Sessions</h2>
    <div style="overflow-x:auto;">
      <table id="sessions"></table>
    </div>
  </div>
</div>

<script>
const I18N = {
  zh: {
    title: '◆ Antigravity Token 看板',
    allTime: '全部时间', today: '仅今日', d7: '最近 7 天', d30: '最近 30 天',
    rollup: '聚合子代理', flat: '展开子会话',
    searchPh: '搜索项目或会话标题...', refresh: '立即刷新',
    updated: (ts, days) => `最后更新: ${ts} · 活跃 ${days} 天 · 每 5 秒自动同步`,
    kpiTotal: '总消耗 Tokens (含缓存)', kpiNet: '非缓存净消耗 (In + Out)',
    kpiNetSub: (i, o) => `新增输入 ${i} · 输出 ${o}`,
    kpiCache: '缓存读取 (Cache Read)', kpiHit: r => `缓存命中率 ${r}%`,
    kpiConv: '会话与调用步数', kpiConvUnit: (s) => `会话 / ${s} 步`,
    kpiConvSub: (m, sub, pct, c) => `主 ${m} · 子代理 ${sub} (${pct}) · 压缩 ${c} 次`,
    hDaily: '▸ 每日消耗趋势（绿: 非缓存净量 / 蓝: 缓存读取）',
    hModels: '▸ 模型消耗分布', hProjects: '▸ 工作区 / 项目排行',
    hSurfaces: '▸ 端侧对比 (IDE vs CLI)', hSessions: '▸ 会话排行明细 (Top 100)',
    cDate: '日期', cSteps: '步数', cNet: '非缓存净量', cCache: '缓存读取', cTot: '总计', cTrend: '趋势',
    cModel: '模型', cHit: '缓存率', cOut: '输出', cShare: '占比',
    cProj: '项目', cMain: '主会话', cSurf: '端侧', cConvs: '会话数', cUncached: '未缓存In',
    cTitle: '会话标题', cActive: '最后活跃', subBadge: n => `+${n} 子代理`, subSelf: '[子代理]',
    warn: (n, s) => `检测到 ${n} 个历史会话（共 ${s} 步）受沙盒隔离未挂载；在系统终端直接运行 agy-usage --web 可查看完整记录。`
  },
  en: {
    title: '◆ Antigravity Token Dashboard',
    allTime: 'All Time', today: 'Today', d7: 'Last 7 Days', d30: 'Last 30 Days',
    rollup: 'Rollup Subagents', flat: 'Flat Sessions',
    searchPh: 'Filter project or session title...', refresh: 'Refresh',
    updated: (ts, days) => `Updated: ${ts} · Active ${days} day(s) · Auto-sync every 5s`,
    kpiTotal: 'Total Tokens (w/ Cache)', kpiNet: 'Uncached Net (In + Out)',
    kpiNetSub: (i, o) => `Uncached In ${i} · Output ${o}`,
    kpiCache: 'Cache Read Tokens', kpiHit: r => `Cache Hit Rate ${r}%`,
    kpiConv: 'Conversations & Steps', kpiConvUnit: (s) => `convs / ${s} steps`,
    kpiConvSub: (m, sub, pct, c) => `Main ${m} · Sub ${sub} (${pct}) · Compactions ${c}`,
    hDaily: '▸ Daily Token Trend (Green: Net / Blue: Cache Read)',
    hModels: '▸ Model Breakdown', hProjects: '▸ Workspaces / Projects',
    hSurfaces: '▸ Surface Breakdown (IDE vs CLI)', hSessions: '▸ Top Sessions (Top 100)',
    cDate: 'Date', cSteps: 'Steps', cNet: 'Net', cCache: 'Cache Read', cTot: 'Total', cTrend: 'Trend',
    cModel: 'Model', cHit: 'Hit%', cOut: 'Output', cShare: 'Share',
    cProj: 'Project', cMain: 'Convs', cSurf: 'Surface', cConvs: 'Convs', cUncached: 'Uncached In',
    cTitle: 'Session Title', cActive: 'Last Active', subBadge: n => `+${n} sub`, subSelf: '[sub]',
    warn: (n, s) => `${n} historical conversation(s) (${s} steps) are hidden by sandbox mount; run agy-usage --web in host terminal for full stats.`
  }
};

let lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';

const fmt = n => {
  n = Number(n || 0);
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return String(n);
};
const pct = (a, b) => b > 0 ? ((a/b)*100).toFixed(1) + '%' : '0.0%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function applyStaticI18N() {
  const L = I18N[lang];
  document.getElementById('title').textContent = L.title;
  document.getElementById('search').placeholder = L.searchPh;
  document.getElementById('refreshBtn').textContent = L.refresh;
  document.getElementById('hDaily').textContent = L.hDaily;
  document.getElementById('hModels').textContent = L.hModels;
  document.getElementById('hProjects').textContent = L.hProjects;
  document.getElementById('hSurfaces').textContent = L.hSurfaces;
  document.getElementById('hSessions').textContent = L.hSessions;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (L[k]) el.textContent = L[k];
  });
}

function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyStaticI18N();
  loadData();
}

async function loadData() {
  const L = I18N[lang];
  const surface = document.getElementById('surface').value;
  const days = document.getElementById('days').value;
  const flat = document.getElementById('flat').value;
  const q = document.getElementById('search').value.trim();
  const res = await fetch('/api/usage?' + new URLSearchParams({ surface, days, flat, q }).toString());
  const d = await res.json();
  const t = d.totals;

  document.getElementById('updated').textContent =
    L.updated((d.generated_at || '').slice(0,19).replace('T', ' '), t.active_days);

  const wb = document.getElementById('warnBox');
  if (d.inaccessible_conversations > 0) {
    wb.style.display = 'block';
    wb.textContent = L.warn(d.inaccessible_conversations, d.inaccessible_steps);
  } else {
    wb.style.display = 'none';
  }

  document.getElementById('kpis').innerHTML = `
    <div class="card"><div class="label">${L.kpiTotal}</div><div class="val" style="color:var(--cyan)">${fmt(t.total_tokens)}</div><div class="sub">${Number(t.total_tokens).toLocaleString()}</div></div>
    <div class="card"><div class="label">${L.kpiNet}</div><div class="val" style="color:var(--green)">${fmt(t.net_tokens)}</div><div class="sub">${L.kpiNetSub(fmt(t.uncached_input), fmt(t.output))}</div></div>
    <div class="card"><div class="label">${L.kpiCache}</div><div class="val">${fmt(t.cache_read)}</div><div class="sub" style="color:var(--amber)">${L.kpiHit((t.cache_hit_rate*100).toFixed(1))}</div></div>
    <div class="card"><div class="label">${L.kpiConv}</div><div class="val" style="color:var(--purple)">${t.conversations} <span style="font-size:14px;font-weight:400;color:var(--muted)">${L.kpiConvUnit(Number(t.steps).toLocaleString())}</span></div><div class="sub">${L.kpiConvSub(t.main_conversations, t.subagent_conversations, pct(t.subagent_tokens, t.total_tokens), t.compactions)}</div></div>
  `;

  const daysArr = d.by_date || [];
  const maxDay = Math.max(1, ...daysArr.map(v => v.total_tokens));
  document.getElementById('daily').innerHTML = `<table>
    <tr><th>${L.cDate}</th><th>${L.cSteps}</th><th>${L.cNet}</th><th>${L.cCache}</th><th>${L.cTot}</th><th style="width:32%">${L.cTrend}</th></tr>
    ${daysArr.map(v => `<tr>
      <td>${esc(v.key)}${v.key === d.today ? ' *' : ''}</td><td>${v.steps}</td><td>${fmt(v.net_tokens)}</td><td>${fmt(v.cache_read)}</td><td><b>${fmt(v.total_tokens)}</b></td>
      <td><div class="bar-track">
        <div class="bar-net" style="width:${(v.net_tokens/maxDay*100).toFixed(1)}%"></div>
        <div class="bar-cache" style="width:${(v.cache_read/maxDay*100).toFixed(1)}%"></div>
      </div></td>
    </tr>`).join('')}
  </table>`;

  const modelsArr = d.by_model || [];
  document.getElementById('models').innerHTML = `<table>
    <tr><th>${L.cModel}</th><th>${L.cSteps}</th><th>${L.cHit}</th><th>${L.cOut}</th><th>${L.cTot}</th><th>${L.cShare}</th></tr>
    ${modelsArr.map(v => `<tr>
      <td style="color:var(--cyan)">${esc(v.key)}</td><td>${v.steps}</td>
      <td>${pct(v.cache_read, v.uncached_input + v.cache_read)}</td><td>${fmt(v.output)}</td>
      <td><b>${fmt(v.total_tokens)}</b></td><td>${pct(v.total_tokens, t.total_tokens)}</td>
    </tr>`).join('')}
  </table>`;

  const projArr = d.by_project || [];
  document.getElementById('projects').innerHTML = `<table>
    <tr><th>${L.cProj}</th><th>${L.cMain}</th><th>${L.cSteps}</th><th>${L.cNet}</th><th>${L.cTot}</th><th>${L.cShare}</th></tr>
    ${projArr.map(v => `<tr>
      <td><b>${esc(v.key)}</b></td><td>${v.conversations || 0}</td><td>${v.steps}</td>
      <td>${fmt(v.net_tokens)}</td><td><b>${fmt(v.total_tokens)}</b></td><td>${pct(v.total_tokens, t.total_tokens)}</td>
    </tr>`).join('')}
  </table>`;

  document.getElementById('surfaces').innerHTML = `<table>
    <tr><th>${L.cSurf}</th><th>${L.cConvs}</th><th>${L.cSteps}</th><th>${L.cUncached}</th><th>${L.cCache}</th><th>${L.cOut}</th><th>${L.cTot}</th></tr>
    ${['ide', 'cli'].map(k => {
      const s = (d.by_surface && d.by_surface[k]) || {conversations:0,steps:0,uncached_input:0,cache_read:0,output:0,total_tokens:0};
      return `<tr>
        <td><span class="badge ${k}">${k.toUpperCase()}</span></td>
        <td>${s.conversations || 0}</td><td>${s.steps}</td><td>${fmt(s.uncached_input)}</td>
        <td>${fmt(s.cache_read)}</td><td>${fmt(s.output)}</td><td><b>${fmt(s.total_tokens)}</b></td>
      </tr>`;
    }).join('')}
  </table>`;

  const sessArr = (d.sessions || []).slice(0, 100);
  document.getElementById('sessions').innerHTML = `
    <tr><th style="text-align:left">${L.cSurf}</th><th style="text-align:left">${L.cTitle}</th><th style="text-align:left">${L.cProj}</th><th>${L.cSteps}</th><th>${L.cUncached}</th><th>${L.cCache}</th><th>${L.cOut}</th><th>${L.cTot}</th><th>${L.cActive}</th></tr>
    ${sessArr.map(s => `<tr>
      <td style="text-align:left"><span class="badge ${esc(s.surface)}">${esc(s.surface.toUpperCase())}</span></td>
      <td style="text-align:left"><span style="color:var(--muted);font-size:11px">${esc(s.conversation_id.slice(0,8))}</span> ${esc(s.title)}${s.subagent_count ? `<span class="subtag">${L.subBadge(s.subagent_count)}</span>` : (s.is_subagent ? `<span class="subtag">${L.subSelf}</span>` : '')}</td>
      <td style="text-align:left">${esc(s.project)}</td>
      <td>${s.steps}</td><td>${fmt(s.uncached_input)}</td><td>${fmt(s.cache_read)}</td><td>${fmt(s.output)}</td>
      <td><b>${fmt(s.total_tokens)}</b></td>
      <td style="color:var(--muted)">${s.last_active ? esc(s.last_active.slice(5,16).replace('T',' ')) : '-'}</td>
    </tr>`).join('')}
  `;
}

document.getElementById('surface').addEventListener('change', loadData);
document.getElementById('days').addEventListener('change', loadData);
document.getElementById('flat').addEventListener('change', loadData);
document.getElementById('search').addEventListener('input', loadData);
applyStaticI18N();
loadData();
setInterval(loadData, 5000);
</script>
</body>
</html>
